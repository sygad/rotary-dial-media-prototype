<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotary Dial Media — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --page-bg:#ecebe7; --page-fg:#1b1b1b; --page-muted:#6b6b6b;
  --bezel:#0b0b0b; --bezel-edge:#343434;
  --teal:#3c8194; --magenta:#9C0D90; --pink:#AB1049; --yellow:#ECD613;
  --ico-teal:#32ACA4;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page-bg:#131313; --page-fg:#f1f1f1; --page-muted:#9b9b9b; --bezel-edge:#4a4a4a;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page-bg:#131313; --page-fg:#f1f1f1; --page-muted:#9b9b9b; --bezel-edge:#4a4a4a;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;padding:0}
body{
  background:var(--page-bg); color:var(--page-fg);
  font-family:"Inter","Helvetica Neue",system-ui,-apple-system,sans-serif;
  min-height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:20px; padding:26px 16px 34px;
}
h1{font-size:15px;font-weight:600;margin:0;text-align:center}
.sub{font-size:12.5px;color:var(--page-muted);margin:0;text-align:center;max-width:36ch;line-height:1.5}

.device{position:relative;width:min(360px,86vw);aspect-ratio:1;border-radius:50%;
  background:#000;box-shadow:0 14px 38px rgba(0,0,0,.35);
  touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.stage{position:absolute;top:0;left:0;width:360px;height:360px;transform-origin:top left}

.view{position:absolute;top:0;left:0;width:360px;height:360px;display:none;overflow:hidden;border-radius:50%}
.view.active{display:block}
.art{position:absolute;inset:0;background-size:cover;background-position:center}
/* Album art stops at r=174, under the opaque black ring (168 -> 184), so it never
   reaches the display's antialiased outer edge. Without this, the art and the ring
   are each antialiased at the edge and a thin fringe of art shows through. The clip
   sits on a fixed wrapper, not on the sliding strips, so it doesn't move mid-swipe. */
.art-clip,#eqArt,#eqArt2{clip-path:circle(174px at 180px 180px)}
.art-clip{position:absolute;top:0;left:0;width:360px;height:360px}
.np-strip{position:absolute;top:0;left:0;width:360px;height:360px}
.np-strip.snap{transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.np-slide{position:absolute;top:0;left:0;width:360px;height:360px;
  background-size:cover;background-position:center}
.scrim{position:absolute;inset:0;background:transparent}
.scrim.eq{background:rgba(0,0,0,.75)}

.ring{position:absolute;top:0;left:0;width:360px;height:360px;pointer-events:none;z-index:90}
.ring circle{fill:none;stroke-linecap:round;transform:rotate(90deg);transform-origin:50% 50%}
/* Black ring visible 168 -> 180 (12px); drawn out to 184 so the clip edge is
   black. The 8px arc sits centred inside it at 170 -> 178, leaving 2px of
   black either side rather than two edges landing on the same pixel. */
.ring .band{stroke:#000;stroke-width:16;stroke-linecap:butt}
.ring .val{stroke-width:8;transition:stroke-dashoffset .1s linear}

#clock{background:#000}
.time{position:absolute;left:0;right:0;top:122px;height:116px;text-align:center;
  font-size:96px;font-weight:200;line-height:116px;color:#fff;font-variant-numeric:tabular-nums}

#menu{background:#000}
.menu-pill{position:absolute;left:54px;top:151px;width:251px;height:58px;border-radius:29px;
  background:var(--teal);z-index:1}
.menu-list{position:absolute;left:0;right:0;top:0;text-align:center;z-index:2}
.menu-list.snap{transition:transform .22s cubic-bezier(.2,.85,.35,1)}
.menu-item{height:60px;line-height:60px;font-size:36px;font-weight:300;color:#808080;transition:color .18s}
.menu-item.sel{color:#fff}

.album-track{position:absolute;top:0;left:0;width:360px;height:360px}
.album-track.snap{transition:transform .26s cubic-bezier(.2,.9,.3,1)}
.album-slide{position:absolute;top:0;left:0;width:360px;height:360px;overflow:hidden}
.album-label{position:absolute;left:-2px;top:267.7px;width:364px;height:52px;
  background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:24px;z-index:8;overflow:hidden}
.album-label.mq{justify-content:flex-start;padding-left:70px}
.label-inner{white-space:nowrap}

.np-disc{position:absolute;left:126px;top:107.3px;width:120px;height:120px;border-radius:60px;
  background:rgba(0,0,0,.8);transition:opacity .28s;z-index:5}
.np-tri{position:absolute;left:178px;top:142px;width:30px;height:46.9px;z-index:6;
  transition:opacity .28s}
.np-band{position:absolute;left:33px;top:138px;width:294px;height:85px;border-radius:42.5px;
  background:rgba(0,0,0,.8);opacity:0;pointer-events:none;transition:opacity .22s;z-index:6}
.np-band.show{opacity:1}
.np-ctl{position:absolute;z-index:7;opacity:0;pointer-events:none;transition:opacity .22s}
.np-band.show ~ .np-ctl{opacity:1}
.np-prev{left:68.9px;top:159.6px;width:39.1px;height:33.8px}
.np-next{left:252px;top:159.6px;width:39.1px;height:33.8px}
.np-pause{left:160.4px;top:151px;width:39.1px;height:50.8px}
.np-bar{position:absolute;left:69px;top:213.8px;width:222.1px;height:3.4px;
  background:#d9d9d9;border-radius:1.7px;overflow:hidden;z-index:7;
  opacity:0;pointer-events:none;transition:opacity .22s}
.np-band.show ~ .np-bar{opacity:1}
.np-bar i{display:block;height:100%;width:0%;background:#FF00FB;border-radius:1.7px}
.title-band{position:absolute;left:-2px;top:267.7px;width:364px;height:52px;
  background:rgba(0,0,0,.8);overflow:hidden;z-index:8;transition:opacity .22s}
.playing .title-band{opacity:0;pointer-events:none;transition:opacity 500ms}
.playing.peek .title-band{opacity:1;transition:opacity 250ms}
.title-inner{position:absolute;left:0;top:0;width:100%;height:52px;line-height:52px;
  white-space:nowrap;color:#fff;font-size:24px;font-weight:400;text-align:center;padding:0}
.title-inner.marquee{text-align:left;padding-left:70px}
.title-measure{position:absolute;left:-9999px;top:0;white-space:nowrap;
  font-size:24px;font-weight:400;visibility:hidden}

/* EQ — exported Figma vectors at exported coordinates */
.ico{position:absolute;z-index:10;line-height:0}
.ico.tap{cursor:pointer}
.ico.tap::after{content:"";position:absolute;inset:-26px}
.trident{position:absolute;left:71px;top:48px;width:219px;height:196.9px;z-index:4;pointer-events:none}
/* overview placement */
#eqOver .i-treble{left:77.5px;top:80px;width:50px;height:100px}
#eqOver .i-bass{left:225px;top:92px;width:72px;height:77px}
#eqOver .i-subs{left:136px;top:233.3px;width:75px;height:66.7px}
/* focus placement */
#eqFocus .i-treble{left:154px;top:64px;width:50px;height:100px}
#eqFocus .i-bass{left:152px;top:80px;width:72px;height:77px}
#eqFocus .i-subs{left:142px;top:85px;width:75px;height:66.7px}
#eqFocus .ico{display:none}
#eqFocus .ico.on{display:block}
.ico svg{display:block;width:100%;height:100%}

.back-btn{position:absolute;left:88px;top:206px;width:184px;height:85px;z-index:40;cursor:pointer}
.back-btn svg{display:block;width:100%;height:100%}

/* optical centring: 10px below the mathematical midpoint of 39.65 */
/* centred by auto margins, not translateX(-50%): a fractional element width
   makes the percentage shift land on a half pixel and bias left once scaled */
.chip{position:absolute;left:0;right:0;margin:0 auto;width:max-content;top:49.65px;
  height:28px;line-height:28px;padding:0 14px;background:rgba(0,0,0,.82);color:#fff;
  font-size:14px;text-align:center;border-radius:14px;opacity:0;
  transition:opacity .2s;z-index:95}
.chip.show{opacity:1}

.hint{font-size:12px;color:var(--page-muted);text-align:center;line-height:1.6;max-width:42ch;min-height:3.2em}
.hint b{color:var(--page-fg);font-weight:600}
.reset{background:none;border:1px solid var(--page-muted);color:var(--page-muted);
  font:inherit;font-size:11.5px;padding:6px 14px;border-radius:14px;cursor:pointer}
</style>
</head>

<script>
(function(){
  "use strict";
  var C = 2*Math.PI*174, STEP = 60, N = 5;
  var S = {view:"clock",menu:2,album:0,track:0,playing:false,volume:60,
           param:"bass",eq:{treble:0,bass:0,subs:0}};
  var MENU = ["Search","Playlist","Albums","Artists","Radio"];
  var COL = {treble:"#32ACA4", bass:"#9C0D90", subs:"#AB1049"};
  var $ = function(i){return document.getElementById(i);};
  var V = {clock:$("clock"),menu:$("menu"),albums:$("albums"),
           nowplaying:$("nowplaying"),eqOver:$("eqOver"),eqFocus:$("eqFocus")};
  var HINT = {
    clock:"<b>Tap</b> to wake",
    menu:"<b>Drag up / down</b> &middot; <b>tap</b> to choose",
    albums:"<b>Drag left / right</b> between albums &middot; <b>tap</b> to open",
    nowplaying:"<b>Tap</b> play &middot; <b>&#10074;&#10074;</b> pause &middot; <b>&#9664;&#9664; / &#9654;&#9654;</b> skip 5s &middot; <b>drag L/R</b> change track &middot; <b>turn the ring</b> for volume &middot; <b>drag up</b> for EQ",
    eqOver:"<b>Tap</b> a zone &middot; <b>drag down</b> to return",
    eqFocus:"<b>Turn the ring</b> to adjust &middot; <b>back</b> for all three &middot; <b>drag down</b> to exit"
  };
  function show(v){ S.view=v; for(var k in V) V[k].classList.toggle("active",k===v); $("hint").innerHTML=HINT[v]; }
  function fit(){ var w=$("device").getBoundingClientRect().width;
    $("stage").style.transform="scale("+(w/360)+")"; return w/360; }
  var K=1;

  var ml=$("menuList");
  MENU.forEach(function(m){var d=document.createElement("div");d.className="menu-item";d.textContent=m;ml.appendChild(d);});
  function menuY(i){ return 150 - i*STEP; }
  function highlight(i){ var it=ml.children; for(var k=0;k<it.length;k++) it[k].classList.toggle("sel",k===i); }
  function renderMenu(){ ml.style.transform="translateY("+menuY(S.menu)+"px)"; highlight(S.menu); }

  var at=$("albumTrack");
  ALBUMS.forEach(function(a,i){
    var s=document.createElement("div"); s.className="album-slide";
    s.style.transform="translateX("+(i*360)+"px)";
    var art=document.createElement("div"); art.className="art";
    art.style.backgroundImage="url("+ART[a.art]+")"; s.appendChild(art);
    var sc=document.createElement("div"); sc.className="scrim"; s.appendChild(sc);
    var l=document.createElement("div"); l.className="album-label";
    var li=document.createElement("span"); li.className="label-inner"; li.textContent=a.title;
    l.appendChild(li); s.appendChild(l);
    at.appendChild(s);
  });
  function renderAlbums(){ at.style.transform="translateX("+(-S.album*360)+"px)"; updateLabels(); }

  function openParam(p){
    S.param=p;
    $("fTreble").classList.toggle("on",p==="treble");
    $("fBass").classList.toggle("on",p==="bass");
    $("fSubs").classList.toggle("on",p==="subs");
    $("eqRing").setAttribute("stroke",COL[p]);
    renderEq(); show("eqFocus");
  }
  function renderEq(){
    var pct=(S.eq[S.param]+12)/24;
    $("eqRing").setAttribute("stroke-dasharray",C);
    $("eqRing").setAttribute("stroke-dashoffset",C*(1-pct));
  }

  var titleAnim = null, titleFront = "A", firstTitle = true, lastCycle = 0;
  var TITLE_SPACE = 220;        // usable width at the band's narrowest (lower) edge

  function scrollSteps(over){
    return [
      {transform:"translateX(0)",             offset:0},
      {transform:"translateX(0)",             offset:0.18},
      {transform:"translateX("+(-over)+"px)", offset:0.52},
      {transform:"translateX("+(-over)+"px)", offset:0.72},
      {transform:"translateX(0)",             offset:1}
    ];
  }
  var labelAnims = [];
  function updateLabels(){
    labelAnims.forEach(function(a){ if(a) a.cancel(); });
    labelAnims = [];
    var slides = at.children, m = $("npMeasure");
    for(var i=0;i<slides.length;i++){
      var outer = slides[i].querySelector(".album-label");
      var inner = outer.querySelector(".label-inner");
      outer.classList.remove("mq"); inner.style.transform = "";
      if(i !== S.album) continue;
      m.textContent = ALBUMS[i].title;
      var over = m.offsetWidth - TITLE_SPACE;
      if(over <= 0) continue;
      outer.classList.add("mq");
      labelAnims.push(inner.animate(scrollSteps(over),
        {duration:2600 + over*55, iterations:Infinity, easing:"ease-in-out"}));
    }
  }

  function marquee(el, text){
    var m = $("npMeasure");
    m.textContent = text;
    var over = m.offsetWidth - TITLE_SPACE;
    el.style.transform = "";
    if(over <= 0){ el.classList.remove("marquee"); lastCycle = 0; return null; }
    el.classList.add("marquee");
    lastCycle = 2600 + over*55;
    return el.animate(scrollSteps(over),
      {duration:lastCycle, iterations:Infinity, easing:"ease-in-out"});
  }

  function setTitle(text){
    var inEl  = $(titleFront === "A" ? "npTitleB" : "npTitleA");
    var outEl = $(titleFront === "A" ? "npTitleA" : "npTitleB");
    if(titleAnim){ titleAnim.cancel(); titleAnim = null; }
    outEl.classList.remove("marquee"); outEl.style.transform = "";
    inEl.textContent = text;
    titleAnim = marquee(inEl, text);
    if(firstTitle){                       // no fade on first paint
      firstTitle = false;
      inEl.style.opacity = "1"; outEl.style.opacity = "0";
    } else {
      inEl.animate([{opacity:0},{opacity:1}], {duration:250, easing:"ease", fill:"forwards"});
      outEl.animate([{opacity:1},{opacity:0}], {duration:250, easing:"ease", fill:"forwards"});
      inEl.style.opacity = "1"; outEl.style.opacity = "0";
    }
    titleFront = (titleFront === "A") ? "B" : "A";
  }

  var stripAlbum = -1;
  function buildStrip(){
    var a = ALBUMS[S.album], s = $("npStrip");
    s.innerHTML = "";
    for(var i=0;i<a.tracks.length;i++){
      var d = document.createElement("div");
      d.className = "np-slide";
      d.style.transform = "translateX("+(i*360)+"px)";
      d.style.backgroundImage = "url("+ART[a.art]+")";
      s.appendChild(d);
    }
    stripAlbum = S.album;
  }
  function stripPos(){ $("npStrip").style.transform = "translateX("+(-S.track*360)+"px)"; }

  var elapsed = 0, TRACK_LEN = 20;      // seconds per track, for the prototype
  function clearBand(){ $("npBand").classList.remove("show");
    $("npDisc").style.opacity="1"; $("npTri").style.opacity="1"; }
  function transport(){
    var p = S.playing;
    $("npBand").classList.toggle("show", p);
    $("npDisc").style.opacity = p ? "0" : "1";
    $("npTri").style.opacity  = p ? "0" : "1";
  }
  var peekT;
  function peekTitle(){
    var np = $("nowplaying");
    if(!S.playing){ np.classList.remove("peek"); return; }
    np.classList.add("peek");
    clearTimeout(peekT);
    // a scrolling title gets one full pass before it fades, capped at 6s so a
    // long title can't outlast the track and keep the band up indefinitely
    var hold = Math.min(6000, Math.max(2000, lastCycle));
    peekT = setTimeout(function(){ np.classList.remove("peek"); }, hold);
  }
  function setTrack(i){
    var a = ALBUMS[S.album];
    S.track = (i + a.tracks.length) % a.tracks.length;
    elapsed = 0; $("prog").style.width = "0%";
    renderNP(); peekTitle();
  }
  function enterNP(){ S.track=0; S.playing=false; elapsed=0; clearTimeout(peekT);
    $("nowplaying").classList.remove("peek");
    $("prog").style.width="0%"; clearBand(); renderNP(); show("nowplaying"); }
  function renderNP(){
    var a=ALBUMS[S.album];
    if(S.track>=a.tracks.length) S.track=0;
    if(stripAlbum !== S.album) buildStrip();
    stripPos();
    setTitle(a.tracks[S.track]);
    $("nowplaying").classList.toggle("playing", S.playing);
    transport();
    var url="url("+ART[a.art]+")";
    $("eqArt").style.backgroundImage=url; $("eqArt2").style.backgroundImage=url;
    var off=C*(1-S.volume/100);
    ["volRing","eqVolRing"].forEach(function(id){
      $(id).setAttribute("stroke-dasharray",C); $(id).setAttribute("stroke-dashoffset",off); });
  }
  var ct;
  // the label at the top is shared: volume changes and skips both use it
  function chip(text){
    $("chip").textContent=text; $("chip").classList.add("show");
    clearTimeout(ct); ct=setTimeout(function(){$("chip").classList.remove("show");},1100);
  }
  function vol(d){
    S.volume=Math.max(0,Math.min(100,S.volume+d));
    chip("Volume "+S.volume);
    renderNP();
  }
  function togglePlay(){ S.playing=!S.playing; renderNP(); peekTitle(); }
  // skip within the track; past the end moves to the next track, back stops at 0
  function skip(d){
    chip((d>0?"+":"\u2212")+Math.abs(d)+"s");
    elapsed=Math.max(0,elapsed+d);
    if(elapsed>=TRACK_LEN){ setTrack(S.track+1); return; }
    $("prog").style.width=(elapsed/TRACK_LEN*100).toFixed(1)+"%";
  }
  // while playing, the transport band (33,138 294x85) splits into thirds:
  // previous icon = back 5s, pause icon = pause, next icon = forward 5s
  function bandZone(e){
    if(!e || !S.playing) return null;
    var r=dev.getBoundingClientRect(), x=(e.clientX-r.left)/K, y=(e.clientY-r.top)/K;
    if(x<33||x>327||y<138||y>223) return null;
    return x<131 ? "back" : x>229 ? "fwd" : "pause";
  }
  setInterval(function(){
    if(!S.playing) return;
    elapsed += 0.1;
    if(elapsed >= TRACK_LEN){ setTrack(S.track+1); return; }
    $("prog").style.width = (elapsed/TRACK_LEN*100).toFixed(1)+"%";
  },100);

  var dev=$("device"), st=null, mode=null, lastA=0, acc=0, startR=0, moved=false;
  function pt(e){ var r=dev.getBoundingClientRect();
    return {x:e.clientX-r.left-r.width/2, y:e.clientY-r.top-r.height/2, R:r.width/2}; }

  dev.addEventListener("pointerdown",function(e){
    dev.setPointerCapture(e.pointerId);
    var p=pt(e); startR=Math.sqrt(p.x*p.x+p.y*p.y); lastA=Math.atan2(p.y,p.x);
    st={x:e.clientX,y:e.clientY}; mode=null; acc=0; moved=false;
    ml.classList.remove("snap"); at.classList.remove("snap");
  });
  dev.addEventListener("pointermove",function(e){
    if(!st) return;
    var p=pt(e), dx=e.clientX-st.x, dy=e.clientY-st.y, r=Math.sqrt(p.x*p.x+p.y*p.y);
    if(Math.abs(dx)>5||Math.abs(dy)>5) moved=true;
    if(mode===null && moved){
      var a0=Math.atan2(p.y,p.x), da=a0-lastA;
      while(da>Math.PI) da-=2*Math.PI; while(da<-Math.PI) da+=2*Math.PI;
      mode=(startR>p.R*0.68 && Math.abs(da)*r>Math.abs(r-startR)*1.2 && Math.abs(da)*r>4)?"rotate":"swipe";
    }
    if(mode==="rotate"){
      var a=Math.atan2(p.y,p.x), d=a-lastA;
      while(d>Math.PI) d-=2*Math.PI; while(d<-Math.PI) d+=2*Math.PI;
      lastA=a; acc+=d*(180/Math.PI);
      while(Math.abs(acc)>=8){ var s=acc>0?1:-1; acc-=s*8; rotate(s); }
      return;
    }
    lastA=Math.atan2(p.y,p.x);
    if(S.view==="menu"){
      var raw=menuY(S.menu)+dy/K;
      raw=Math.max(menuY(N-1)-26,Math.min(menuY(0)+26,raw));
      var idx=Math.max(0,Math.min(N-1,Math.round((150-raw)/STEP)));
      var off=raw-menuY(idx), t=Math.abs(off)/(STEP/2);
      ml.style.transform="translateY("+(raw-off*0.34*(1-t*t))+"px)";
      highlight(idx);
    } else if(S.view==="albums"){
      at.style.transform="translateX("+(-S.album*360+dx/K)+"px)";
    } else if(S.view==="nowplaying" && Math.abs(dx)>Math.abs(dy)){
      var sp=$("npStrip"); sp.classList.remove("snap");
      sp.style.transform="translateX("+(-S.track*360+dx/K)+"px)";
    }
  });
  dev.addEventListener("pointerup",function(e){
    if(!st) return;
    var dx=e.clientX-st.x, dy=e.clientY-st.y, m=mode, mv=moved;
    st=null; mode=null; ml.classList.add("snap"); at.classList.add("snap");
    if(m==="rotate") return;
    if(S.view==="menu"){
      if(mv){ var raw=menuY(S.menu)+dy/K;
        raw=Math.max(menuY(N-1)-26,Math.min(menuY(0)+26,raw));
        S.menu=Math.max(0,Math.min(N-1,Math.round((150-raw)/STEP))); renderMenu();
      } else tap(e);
      return;
    }
    if(S.view==="albums"){
      if(mv){
        if(Math.abs(dy)>60&&Math.abs(dy)>Math.abs(dx)&&dy>0){ show("menu"); renderMenu(); return; }
        if(Math.abs(dx/K)>64){ S.album+=dx<0?1:-1; S.album=Math.max(0,Math.min(ALBUMS.length-1,S.album)); }
        renderAlbums();
      } else tap(e);
      return;
    }
    if(S.view==="nowplaying"){
      $("npStrip").classList.add("snap");
      if(!mv){ tap(e); return; }
      if(Math.abs(dx)>Math.abs(dy)){
        if(Math.abs(dx/K)>64) setTrack(S.track + (dx<0?1:-1)); else stripPos();
        return;
      }
      if(Math.abs(dy)>40) swipe(dy>0?"down":"up"); else stripPos();
      return;
    }
    if(!mv){ tap(e); return; }
    if(Math.abs(dx)<40&&Math.abs(dy)<40) return;
    swipe(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up"));
  });
  dev.addEventListener("wheel",function(e){e.preventDefault();rotate(e.deltaY>0?-1:1);},{passive:false});

  function rotate(s){
    if(S.view==="nowplaying") vol(s*2);
    else if(S.view==="eqFocus"){ S.eq[S.param]=Math.max(-12,Math.min(12,S.eq[S.param]+s)); renderEq(); }
  }
  function hit(e, sel){
    if(!e) return null;
    var el = document.elementFromPoint(e.clientX, e.clientY);
    return (el && el.closest) ? el.closest(sel) : null;
  }
  function tap(e){
    if(S.view==="clock"){ show("menu"); renderMenu(); }
    else if(S.view==="menu"){ show("albums"); renderAlbums(); }
    else if(S.view==="albums"){ enterNP(); }
    else if(S.view==="nowplaying"){
      if(!S.playing){ togglePlay(); return; }   // paused: tap anywhere plays
      var z = bandZone(e);                      // playing: only the transport band responds
      if(z==="back") skip(-5);
      else if(z==="fwd") skip(5);
      else if(z==="pause") togglePlay();
    }
    else if(S.view==="eqOver"){
      var z = hit(e, ".ico.tap");
      if(z) openParam(z.getAttribute("data-p"));
    }
    else if(S.view==="eqFocus"){
      if(hit(e, ".back-btn")) show("eqOver");
    }
  }
  function swipe(d){
    if(S.view==="nowplaying"){
      var a=ALBUMS[S.album];
      if(d==="up"){ clearBand(); show("eqOver"); }
      if(d==="down"){ clearBand(); show("albums"); renderAlbums(); }
    } else if(S.view==="eqOver"||S.view==="eqFocus"){
      if(d==="down"){ renderNP(); show("nowplaying"); }
    } else if(S.view==="clock") tap(e);
  }

  window.addEventListener("resize",function(){K=fit();});
  $("reset").addEventListener("click",function(){
    S={view:"clock",menu:2,album:0,track:0,playing:false,volume:60,param:"bass",eq:{treble:0,bass:0,subs:0}};
    elapsed=0; $("prog").style.width="0%"; clearBand();
    renderMenu(); renderAlbums(); renderNP(); show("clock");
  });
  K=fit(); renderMenu(); renderAlbums(); renderNP(); show("clock");
})();
</script>
</body>
